name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*"
      - "v*.*.*"

env:
  THEOS: ''
  PKG_VERSION: ''
  XCODE_VERSION: '15.4'

jobs:
  build:
    name: Build and upload release package for TrollStore
    runs-on: macos-14

    steps:
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Homebrew dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install dpkg make libplist openssl@3 ldid-procursus
          echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Checkout roothide/theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Add THEOS environment variables
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Checkout theos/sdks
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: master
          path: ${{ env.THEOS }}/sdks

      # 关键改动：构建本 fork，而不是上游 Lessica/TrollSpeed
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          path: TrollSpeed
          submodules: recursive

      - name: Setup build environment
        run: |
          echo "FINALPACKAGE=1" >> $GITHUB_ENV
          cd $GITHUB_WORKSPACE/TrollSpeed
          echo "PKG_VERSION=$(./get-version.sh)" >> $GITHUB_ENV

      # 用 theos 构建（Makefile 是通配符，sources/kfd/ 下的新文件会自动收录）。
      # 不用 ./build.sh（Xcode 工程的文件列表写死在 project.pbxproj 里，新文件不会参与编译）。
      # 也不带 THEOS_PACKAGE_SCHEME，避免 roothide 的 libroot.h 版本冲突。
      - name: Build tipa
        run: |
          cd $GITHUB_WORKSPACE/TrollSpeed
          ./gen-control.sh
          FINALPACKAGE=1 gmake package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrollSpeedWZ_${{ env.PKG_VERSION }}
          path: TrollSpeed/packages/*.tipa
          if-no-files-found: error
